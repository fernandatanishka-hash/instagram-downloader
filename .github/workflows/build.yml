              Tab("settings", "Settings", Icons.Default.Settings)
          )

          class MainActivity : ComponentActivity() {

              private val vm: MainViewModel by viewModels()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()

                  setContent {
                      val settings by vm.prefs.state.collectAsState()

                      val permissionLauncher = rememberLauncher()
                      LaunchedEffect(Unit) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              permissionLauncher("android.permission.POST_NOTIFICATIONS")
                          } else if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P) {
                              permissionLauncher("android.permission.WRITE_EXTERNAL_STORAGE")
                          }
                          vm.handleIntent(intent)
                      }

                      FlowSnapTheme(darkTheme = settings.darkMode) {
                          AppRoot(vm)
                      }
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  vm.handleIntent(intent)
              }

              @Composable
              private fun rememberLauncher(): (String) -> Unit {
                  val launcher = androidx.activity.compose.rememberLauncherForActivityResult(
                      ActivityResultContracts.RequestPermission()
                  ) { }
                  return remember { { perm: String -> launcher.launch(perm) } }
              }
          }

          @Composable
          private fun AppRoot(vm: MainViewModel) {
              val navController = rememberNavController()
              val backStack by navController.currentBackStackEntryAsState()
              val currentRoute = backStack?.destination?.route
              val state by vm.state.collectAsState()
              val toast by vm.toast.collectAsState()
              val snackbar = remember { SnackbarHostState() }

              // Jump to the preview screen as soon as a link starts resolving.
              LaunchedEffect(state) {
                  if (state is ResolveState.Loading || state is ResolveState.Success || state is ResolveState.Error) {
                      if (currentRoute != "preview") navController.navigate("preview")
                  }
              }

              LaunchedEffect(toast) {
                  toast?.let {
                      snackbar.showSnackbar(it)
                      vm.consumeToast()
                  }
              }

              Scaffold(
                  containerColor = Ink,
                  snackbarHost = { SnackbarHost(snackbar) },
                  bottomBar = {
                      if (currentRoute != "preview" && currentRoute != "storage") {
                          NavigationBar(containerColor = InkCard) {
                              TABS.forEach { tab ->
                                  val selected = backStack?.destination?.hierarchy?.any { it.route == tab.route } == true
                                  NavigationBarItem(
                                      selected = selected,
                                      onClick = {
                                          navController.navigate(tab.route) {
                                              popUpTo(navController.graph.findStartDestination().id) { saveState = true }
                                              launchSingleTop = true
                                              restoreState = true
                                          }
                                      },
                                      icon = { Icon(tab.icon, contentDescription = tab.label) },
                                      label = { Text(tab.label, style = MaterialTheme.typography.labelSmall) },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = NeonPink,
                                          selectedTextColor = NeonPink,
                                          unselectedIconColor = TextLo,
                                          unselectedTextColor = TextLo,
                                          indicatorColor = InkCard
                                      )
                                  )
                              }
                          }
                      }
                  }
              ) { inner ->
                  Box(
                      Modifier
                          .fillMaxSize()
                          .background(MaterialTheme.colorScheme.background)
                          .padding(inner)
                  ) {
                      NavHost(navController = navController, startDestination = "home") {
                          composable("home") {
                              HomeScreen(vm, onOpenDownloads = { navController.navigate("downloads") })
                          }
                          composable("preview") {
                              PreviewScreen(vm, onBack = {
                                  vm.reset()
                                  navController.popBackStack()
                              })
                          }
                          composable("downloads") {
                              DownloadsScreen(vm, onOpenStorage = { navController.navigate("storage") })
                          }
                          composable("favorites") { FavoritesScreen(vm) }
                          composable("settings") {
                              SettingsScreen(vm, onOpenStorage = { navController.navigate("storage") })
                          }
                          composable("storage") {
                              StorageScreen(vm, onBack = { navController.popBackStack() })
                          }
                      }
                  }
              }
          }
