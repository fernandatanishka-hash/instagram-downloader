          import okhttp3.OkHttpClient
          import java.util.concurrent.TimeUnit

          object Net {
              const val UA =
                  "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) " +
                      "Chrome/122.0.0.0 Mobile Safari/537.36"

              /** User-Agent of the Android app, required by i.instagram.com/api/v1. */
              const val APP_UA = "Instagram 309.1.0.41.113 Android (33/13; 420dpi; 1080x2176; Google/google; Pixel 7; panther; qcom; en_US)"

              /** Public web app id used by instagram.com itself for anonymous requests. */
              const val IG_APP_ID = "936619743392459"

              /**
               * Optional `sessionid` cookie. Empty = fully anonymous (public posts only).
               * Set from Settings; enables Stories, Highlights and private-but-followed posts.
               */
              @Volatile
              var sessionId: String = ""

              fun cookieHeader(): String =
                  if (sessionId.isBlank()) "" else "sessionid=${sessionId.trim()};"

              val client: OkHttpClient by lazy {
                  OkHttpClient.Builder()
                      .connectTimeout(20, TimeUnit.SECONDS)
                      .readTimeout(30, TimeUnit.SECONDS)
                      .followRedirects(true)
                      .retryOnConnectionFailure(true)
                      .build()
