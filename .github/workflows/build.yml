          import com.flowsnap.app.ui.MainViewModel
          import com.flowsnap.app.ui.components.*
          import com.flowsnap.app.ui.theme.*

          @Composable
          fun PreviewScreen(vm: MainViewModel, onBack: () -> Unit) {
              val state by vm.state.collectAsState()
              val index by vm.selectedIndex.collectAsState()
              val progress by vm.downloadProgress.collectAsState()

              Column(Modifier.fillMaxSize().padding(horizontal = 18.dp).verticalScroll(rememberScrollState())) {
                  Spacer(Modifier.height(10.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, null, tint = TextHi) }
                      Text("Preview & Download", color = TextHi, fontWeight = FontWeight.Bold)
                  }
                  Spacer(Modifier.height(8.dp))

                  when (val s = state) {
                      is ResolveState.Loading -> LoadingBlock()
                      is ResolveState.Error -> ErrorBlock(s.message) { vm.resolve() }
                      is ResolveState.Success -> {
                          val post = s.post
                          val item = post.items.getOrElse(index) { post.items.first() }
                          var selectedVariant by remember(item.id) { mutableStateOf(item.variants.firstOrNull()) }

                          Box(
                              Modifier.fillMaxWidth().height(230.dp)
                                  .clip(RoundedCornerShape(18.dp)).background(InkCard2),
                              contentAlignment = Alignment.Center
                          ) {
                              AsyncImage(
                                  model = item.thumbnailUrl,
                                  contentDescription = null,
                                  modifier = Modifier.fillMaxSize(),
                                  contentScale = ContentScale.Crop
                              )
                              if (item.kind == MediaKind.VIDEO) {
                                  Box(
                                      Modifier.size(56.dp).clip(CircleShape)
                                          .background(Color.Black.copy(alpha = .45f)),
                                      contentAlignment = Alignment.Center
                                  ) { Icon(Icons.Default.PlayArrow, null, tint = Color.White, modifier = Modifier.size(32.dp)) }
                              }
                              if (item.durationSec > 0) {
                                  Text(
                                      formatDuration(item.durationSec),
                                      color = Color.White,
                                      style = MaterialTheme.typography.bodySmall,
                                      modifier = Modifier.align(Alignment.BottomEnd).padding(10.dp)
                                          .background(Color.Black.copy(alpha = .55f), RoundedCornerShape(6.dp))
                                          .padding(horizontal = 6.dp, vertical = 2.dp)
                                  )
                              }
                          }

                          if (post.items.size > 1) {
                              Spacer(Modifier.height(10.dp))
                              LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  itemsIndexed(post.items) { i, it ->
                                      AsyncImage(
                                          model = it.thumbnailUrl,
                                          contentDescription = null,
                                          contentScale = ContentScale.Crop,
                                          modifier = Modifier.size(58.dp)
                                              .clip(RoundedCornerShape(10.dp))
                                              .border(
                                                  2.dp,
                                                  if (i == index) NeonPink else Stroke,
                                                  RoundedCornerShape(10.dp)
                                              )
                                              .clickable { vm.selectIndex(i) }
                                      )
                                  }
                              }
                          }

                          Spacer(Modifier.height(14.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              AsyncImage(
                                  model = post.avatarUrl,
                                  contentDescription = null,
                                  modifier = Modifier.size(34.dp).clip(CircleShape).background(InkCard2)
                              )
                              Spacer(Modifier.width(10.dp))
                              Column {
                                  Text("@${post.username}", color = TextHi, style = MaterialTheme.typography.bodyMedium)
                                  Text(
                                      buildString {
                                          append(if (item.kind == MediaKind.VIDEO) "Reel" else "Photo")
                                          if (item.durationSec > 0) append(" • ${formatDuration(item.durationSec)}")
                                          selectedVariant?.let { append(" • ${formatSize(it.approxBytes)}") }
                                      },
                                      color = TextLo,
                                      style = MaterialTheme.typography.bodySmall
                                  )
                              }
                          }

                          Spacer(Modifier.height(16.dp))
                          Text("Download Quality", color = TextHi, fontWeight = FontWeight.SemiBold)
                          Spacer(Modifier.height(8.dp))
                          item.variants.forEachIndexed { i, v ->
                              val selected = v == selectedVariant
                              NeonCard(
                                  modifier = Modifier.padding(bottom = 8.dp).clickable { selectedVariant = v },
                                  selected = selected
                              ) {
                                  Row(
                                      Modifier.fillMaxWidth().padding(14.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      RadioButton(
                                          selected = selected,
                                          onClick = { selectedVariant = v },
                                          colors = RadioButtonDefaults.colors(selectedColor = NeonPurple)
                                      )
                                      Spacer(Modifier.width(6.dp))
                                      Column(Modifier.weight(1f)) {
                                          Text(v.label, color = TextHi, style = MaterialTheme.typography.bodyMedium)
                                          if (v.height > 0) {
                                              Text("${v.width}×${v.height}", color = TextLo, style = MaterialTheme.typography.bodySmall)
                                          }
                                      }
                                      if (i == 0) {
                                          Text(
                                              "Recommended",
                                              color = NeonPink,
                                              style = MaterialTheme.typography.labelSmall,
                                              modifier = Modifier
                                                  .background(NeonPink.copy(alpha = .14f), RoundedCornerShape(8.dp))
                                                  .padding(horizontal = 8.dp, vertical = 3.dp)
                                          )
                                          Spacer(Modifier.width(8.dp))
                                      }
                                      Text(formatSize(v.approxBytes), color = TextLo, style = MaterialTheme.typography.bodySmall)
                                  }
                              }
                          }

                          progress?.let { p ->
                              if (!p.done) {
                                  LinearProgressIndicator(
                                      progress = { p.percent / 100f },
                                      modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp),
                                      color = NeonPink,
                                      trackColor = Stroke
                                  )
                                  Text("${p.percent}% • ${p.fileName}", color = TextLo, style = MaterialTheme.typography.bodySmall)
                              }
                          }

                          Spacer(Modifier.height(10.dp))
                          GradientButton(
                              text = "Download",
                              modifier = Modifier.fillMaxWidth(),
                              icon = Icons.Default.Download,
                              enabled = selectedVariant != null
                          ) {
                              selectedVariant?.let { vm.download(post, item, it, index) }
                          }

                          if (post.items.size > 1) {
                              Spacer(Modifier.height(10.dp))
                              OutlinedButton(
                                  onClick = { vm.downloadAll(post) },
                                  modifier = Modifier.fillMaxWidth().height(50.dp),
                                  shape = RoundedCornerShape(16.dp),
                                  border = androidx.compose.foundation.BorderStroke(1.dp, NeonPurple)
                              ) { Text("Download all ${post.items.size} items", color = NeonPurple) }
                          }
                          Spacer(Modifier.height(24.dp))
                      }
                      ResolveState.Idle -> Unit
                  }
              }
          }

          @Composable
          private fun LoadingBlock() {
              Column(
                  Modifier.fillMaxWidth().padding(top = 80.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  CircularProgressIndicator(color = NeonPink)
                  Spacer(Modifier.height(14.dp))
                  Text("Fetching media…", color = TextLo)
              }
          }

          @Composable
          private fun ErrorBlock(message: String, onRetry: () -> Unit) {
              NeonCard(modifier = Modifier.padding(top = 40.dp)) {
                  Column(Modifier.padding(20.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                      Icon(Icons.Default.ErrorOutline, null, tint = NeonRose, modifier = Modifier.size(38.dp))
                      Spacer(Modifier.height(10.dp))
                      Text(message, color = TextLo, style = MaterialTheme.typography.bodySmall)
                      Spacer(Modifier.height(14.dp))
                      GradientButton("Try again", Modifier.fillMaxWidth()) { onRetry() }
                  }
              }
          }
          FLOWSNAP_EOF

          cat > app/src/main/java/com/flowsnap/app/ui/screens/SettingsScreen.kt <<'FLOWSNAP_EOF'
          package com.flowsnap.app.ui.screens

          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.unit.dp
          import com.flowsnap.app.ui.MainViewModel
          import com.flowsnap.app.ui.components.NeonCard
          import com.flowsnap.app.ui.components.SectionTitle
          import com.flowsnap.app.ui.components.formatSize
          import com.flowsnap.app.ui.theme.*

          @Composable
          fun SettingsScreen(vm: MainViewModel, onOpenStorage: () -> Unit) {
              val s by vm.prefs.state.collectAsState()
              var showSessionDialog by remember { mutableStateOf(false) }

              if (showSessionDialog) {
                  SessionDialog(
                      current = s.sessionId,
                      onDismiss = { showSessionDialog = false },
                      onSave = { value ->
                          vm.prefs.update { it.copy(sessionId = value.trim()) }
                          showSessionDialog = false
                          vm.showToast(if (value.isBlank()) "Session cleared" else "Session saved")
                      }
                  )
              }

              Column(
                  Modifier.fillMaxSize().padding(horizontal = 18.dp).verticalScroll(rememberScrollState())
              ) {
                  Spacer(Modifier.height(14.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Icon(Icons.Default.Settings, null, tint = NeonPurple)
                      Spacer(Modifier.width(8.dp))
                      Text("Settings", style = MaterialTheme.typography.titleLarge, color = TextHi)
                  }

                  Spacer(Modifier.height(18.dp))
                  SectionTitle("DOWNLOADS")
                  Spacer(Modifier.height(8.dp))
                  NeonCard {
                      Column {
                          NavRow(Icons.Default.Folder, "Storage & clean up", onClick = onOpenStorage)
                          HorizontalDivider(color = Stroke)
                          SwitchRow(Icons.Default.HelpOutline, "Ask before downloading", s.askBeforeDownloading) { v ->
                              vm.prefs.update { it.copy(askBeforeDownloading = v) }
                          }
                          HorizontalDivider(color = Stroke)
                          SwitchRow(Icons.Default.Wifi, "Wi-Fi only", s.wifiOnly) { v ->
                              vm.prefs.update { it.copy(wifiOnly = v) }
                          }
                          HorizontalDivider(color = Stroke)
                          SwitchRow(Icons.Default.PhotoLibrary, "Auto-save to Gallery", s.autoSaveToGallery) { v ->
                              vm.prefs.update { it.copy(autoSaveToGallery = v) }
                          }
                          HorizontalDivider(color = Stroke)
                          SwitchRow(Icons.Default.ContentPaste, "Auto-detect clipboard link", s.autoDetectClipboard) { v ->
                              vm.prefs.update { it.copy(autoDetectClipboard = v) }
                          }
                      }
                  }

                  Spacer(Modifier.height(18.dp))
                  SectionTitle("APPEARANCE")
                  Spacer(Modifier.height(8.dp))
                  NeonCard {
                      Column {
                          SwitchRow(Icons.Default.DarkMode, "Dark mode", s.darkMode) { v ->
                              vm.prefs.update { it.copy(darkMode = v) }
                          }
                          HorizontalDivider(color = Stroke)
                          NavRow(Icons.Default.Palette, "App theme", value = s.theme) {
                              val next = when (s.theme) {
                                  "Purple" -> "Pink"
                                  "Pink" -> "Blue"
                                  else -> "Purple"
                              }
                              vm.prefs.update { it.copy(theme = next) }
                          }
                      }
                  }

                  Spacer(Modifier.height(18.dp))
                  SectionTitle("ADVANCED")
                  Spacer(Modifier.height(8.dp))
                  NeonCard {
                      Column {
                          NavRow(
                              Icons.Default.Key,
                              "Instagram session",
                              value = if (s.sessionId.isBlank()) "Not set" else "Connected"
                          ) { showSessionDialog = true }
                      }
                  }
                  Text(
                      "Optional. Paste your instagram.com `sessionid` cookie to also download Stories, " +
                          "Highlights and posts from private accounts you follow. Stored only on this device.",
                      color = TextLo,
                      style = MaterialTheme.typography.bodySmall,
                      modifier = Modifier.padding(top = 6.dp, start = 4.dp, end = 4.dp)
                  )

                  Spacer(Modifier.height(18.dp))
                  SectionTitle("ABOUT")
                  Spacer(Modifier.height(8.dp))
                  NeonCard {
                      Column {
                          NavRow(Icons.Default.Info, "Version", value = "1.0.0") {}
                          HorizontalDivider(color = Stroke)
                          NavRow(Icons.Default.Shield, "Only download content you have the right to save") {}
                      }
                  }
                  Spacer(Modifier.height(30.dp))
              }
          }

          @Composable
          fun StorageScreen(vm: MainViewModel, onBack: () -> Unit) {
              val items by vm.store.items.collectAsState()
              val used = remember(items) { items.sumOf { it.sizeBytes } }
              val largest = remember(items) { items.sortedByDescending { it.sizeBytes }.take(5) }

              Column(Modifier.fillMaxSize().padding(horizontal = 18.dp).verticalScroll(rememberScrollState())) {
                  Spacer(Modifier.height(10.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, null, tint = TextHi) }
                      Text("Storage", style = MaterialTheme.typography.titleLarge, color = TextHi)
                  }
                  Spacer(Modifier.height(16.dp))
                  NeonCard {
                      Column(Modifier.padding(18.dp)) {
                          Text(formatSize(used), color = TextHi, style = MaterialTheme.typography.headlineSmall)
                          Text("used by FlowSnap · ${items.size} files", color = TextLo,
                              style = MaterialTheme.typography.bodySmall)
                          Spacer(Modifier.height(12.dp))
                          LinearProgressIndicator(
                              progress = { (used / (2L * 1024 * 1024 * 1024).toFloat()).coerceIn(0f, 1f) },
                              modifier = Modifier.fillMaxWidth(),
                              color = NeonPink,
                              trackColor = Stroke
                          )
                      }
                  }

                  Spacer(Modifier.height(18.dp))
                  SectionTitle("LARGEST DOWNLOADS")
                  Spacer(Modifier.height(8.dp))
                  largest.forEach { rec ->
                      NeonCard(modifier = Modifier.padding(bottom = 8.dp)) {
                          Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                              Column(Modifier.weight(1f)) {
                                  Text(rec.fileName, color = TextHi, maxLines = 1,
                                      style = MaterialTheme.typography.bodyMedium)
                                  Text(formatSize(rec.sizeBytes), color = TextLo,
                                      style = MaterialTheme.typography.bodySmall)
                              }
                              IconButton(onClick = { vm.store.remove(rec.id) }) {
                                  Icon(Icons.Default.Delete, null, tint = NeonRose)
                              }
                          }
                      }
                  }

                  Spacer(Modifier.height(10.dp))
                  com.flowsnap.app.ui.components.GradientButton(
                      text = "Clear download history",
                      modifier = Modifier.fillMaxWidth(),
                      icon = Icons.Default.Delete
                  ) {
                      vm.store.clearAll()
                      vm.showToast("History cleared (files stay in your gallery)")
                  }
                  Spacer(Modifier.height(30.dp))
              }
          }

          @Composable
          private fun SwitchRow(icon: ImageVector, label: String, checked: Boolean, onChange: (Boolean) -> Unit) {
              Row(
                  Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(icon, null, tint = NeonPurple, modifier = Modifier.size(20.dp))
                  Spacer(Modifier.width(12.dp))
                  Text(label, color = TextHi, modifier = Modifier.weight(1f),
                      style = MaterialTheme.typography.bodyMedium)
                  Switch(
                      checked = checked,
                      onCheckedChange = onChange,
                      colors = SwitchDefaults.colors(
                          checkedThumbColor = androidx.compose.ui.graphics.Color.White,
                          checkedTrackColor = NeonPurple,
                          uncheckedTrackColor = Stroke
                      )
                  )
              }
          }

          @Composable
          private fun NavRow(icon: ImageVector, label: String, value: String = "", onClick: () -> Unit) {
              Row(
                  Modifier.fillMaxWidth()
                      .clickable(onClick = onClick)
                      .padding(horizontal = 14.dp, vertical = 16.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(icon, null, tint = NeonPurple, modifier = Modifier.size(20.dp))
                  Spacer(Modifier.width(12.dp))
                  Text(label, color = TextHi, modifier = Modifier.weight(1f),
                      style = MaterialTheme.typography.bodyMedium)
                  if (value.isNotEmpty()) {
                      Text(value, color = TextLo, style = MaterialTheme.typography.bodySmall)
                      Spacer(Modifier.width(6.dp))
                  }
                  Icon(Icons.Default.ChevronRight, null, tint = TextLo, modifier = Modifier.size(18.dp))
              }
          }

          @Composable
          private fun SessionDialog(current: String, onDismiss: () -> Unit, onSave: (String) -> Unit) {
              var text by remember { mutableStateOf(current) }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = InkCard,
                  title = { Text("Instagram session", color = TextHi) },
                  text = {
                      Column {
                          Text(
                              "Log in to instagram.com in a browser, open DevTools → Application → Cookies " +
                                  "and copy the value of `sessionid`.",
                              color = TextLo,
                              style = MaterialTheme.typography.bodySmall
                          )
                          Spacer(Modifier.height(12.dp))
                          OutlinedTextField(
                              value = text,
                              onValueChange = { text = it },
                              placeholder = { Text("sessionid value", color = TextLo) },
                              singleLine = true,
                              colors = OutlinedTextFieldDefaults.colors(
                                  focusedContainerColor = InkCard2,
                                  unfocusedContainerColor = InkCard2,
                                  focusedBorderColor = NeonPurple,
                                  unfocusedBorderColor = Stroke,
                                  focusedTextColor = TextHi,
                                  unfocusedTextColor = TextHi
                              )
                          )
                      }
                  },
                  confirmButton = { TextButton(onClick = { onSave(text) }) { Text("Save", color = NeonPink) } },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Cancel", color = TextLo) } }
              )
          }
          FLOWSNAP_EOF

          cat > app/src/main/java/com/flowsnap/app/ui/theme/Theme.kt <<'FLOWSNAP_EOF'
          package com.flowsnap.app.ui.theme

          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Typography
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp

          // --- FlowSnap neon palette -------------------------------------------------
          val Ink = Color(0xFF0B0718)
          val InkCard = Color(0xFF15102B)
          val InkCard2 = Color(0xFF1C1540)
          val Stroke = Color(0xFF2A2152)
          val NeonViolet = Color(0xFF7C3AED)
          val NeonPurple = Color(0xFFA855F7)
          val NeonPink = Color(0xFFE935C1)
          val NeonRose = Color(0xFFFB3B6E)
          val NeonBlue = Color(0xFF4F8CFF)
          val TextHi = Color(0xFFF2EEFF)
          val TextLo = Color(0xFF9A92BF)

          val BrandGradient = Brush.horizontalGradient(listOf(NeonViolet, NeonPink, NeonRose))
          val BrandGradientSoft = Brush.horizontalGradient(listOf(NeonViolet.copy(alpha = .25f), NeonPink.copy(alpha = .25f)))

          private val DarkColors = darkColorScheme(
              primary = NeonPurple,
              onPrimary = Color.White,
              secondary = NeonPink,
              background = Ink,
              onBackground = TextHi,
              surface = InkCard,
              onSurface = TextHi,
              surfaceVariant = InkCard2,
              onSurfaceVariant = TextLo,
              outline = Stroke,
              error = NeonRose
          )

          private val LightColors = lightColorScheme(
              primary = NeonViolet,
              secondary = NeonPink,
              background = Color(0xFFF7F5FF),
              surface = Color.White,
              error = NeonRose
          )

          private val AppTypography = Typography(
              headlineSmall = TextStyle(fontWeight = FontWeight.Bold, fontSize = 24.sp),
              titleLarge = TextStyle(fontWeight = FontWeight.Bold, fontSize = 20.sp),
              titleMedium = TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 16.sp),
              bodyMedium = TextStyle(fontSize = 14.sp),
              bodySmall = TextStyle(fontSize = 12.sp),
              labelSmall = TextStyle(fontWeight = FontWeight.Medium, fontSize = 11.sp)
          )

          @Composable
          fun FlowSnapTheme(darkTheme: Boolean = isSystemInDarkTheme(), content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = if (darkTheme) DarkColors else LightColors,
                  typography = AppTypography,
                  content = content
              )
          }
          FLOWSNAP_EOF


      - name: Show generated tree
        working-directory: build-src
        run: find . -type f | sort

      - name: Build APK
        working-directory: build-src
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp build-src/app/build/outputs/apk/debug/app-debug.apk artifacts/FlowSnap.apk
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowSnap-apk
          path: artifacts/FlowSnap.apk
          retention-days: 90
          if-no-files-found: error

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/FlowSnap.apk
