          package com.flowsnap.app.data

          /** One downloadable variant of a media item (e.g. Original / 1080p / 720p). */
          data class MediaVariant(
              val label: String,
              val url: String,
              val width: Int = 0,
              val height: Int = 0,
              val approxBytes: Long = 0L
          )

          enum class MediaKind { VIDEO, PHOTO }

          /** A single photo or video inside a post (a carousel post has several). */
          data class MediaItem(
              val id: String,
              val kind: MediaKind,
              val thumbnailUrl: String,
              val variants: List<MediaVariant>,
              val durationSec: Double = 0.0
          ) {
              val best: MediaVariant? get() = variants.firstOrNull()
          }

          /** The whole resolved post. */
          data class ResolvedPost(
              val shortcode: String,
              val username: String,
              val avatarUrl: String,
              val caption: String,
              val isReel: Boolean,
              val items: List<MediaItem>,
              val sourceUrl: String
          )

          /** A row in the Downloads screen. */
          data class DownloadRecord(
              val id: Long,
              val fileName: String,
              val localUri: String,
              val remoteUrl: String,
              val thumbnailUrl: String,
              val kind: MediaKind,
              val sizeBytes: Long,
              val createdAt: Long,
              val username: String = "",
              val favorite: Boolean = false,
              val collection: String = ""
          )

          sealed interface ResolveState {
              data object Idle : ResolveState
              data object Loading : ResolveState
              data class Error(val message: String) : ResolveState
              data class Success(val post: ResolvedPost) : ResolveState
          }
