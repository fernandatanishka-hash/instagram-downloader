                  when (filter) {
                      "Reels" -> all.filter { it.fileName.startsWith("reels") }
                      "Photos" -> all.filter { it.kind == MediaKind.PHOTO }
                      "Videos" -> all.filter { it.kind == MediaKind.VIDEO }
