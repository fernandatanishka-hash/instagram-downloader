name: Build FlowSnap APK

# One-file Android build: this workflow GENERATES the whole FlowSnap
# Instagram-downloader project (Kotlin + Jetpack Compose) and compiles it
# into an installable .apk. The repo needs nothing but this file.
#
#   Actions -> Build FlowSnap APK -> Run workflow
#   then download the "FlowSnap-apk" artifact -> FlowSnap.apk -> install it.
#
# Produces ONE installable APK (debug-signed, works on any Android 7+ phone).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    name: Generate project and assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package list contains the obsolete "tools" package,
          # which Google removed from the SDK repository -> sdkmanager exits 1.
          # Install nothing here and pull exactly what we need in the next step.
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create project folders
        run: |
          rm -rf build-src
          mkdir -p build-src/app/src/main/java/com/flowsnap/app/data
          mkdir -p build-src/app/src/main/java/com/flowsnap/app/ui/theme
          mkdir -p build-src/app/src/main/java/com/flowsnap/app/ui/screens
          mkdir -p build-src/app/src/main/java/com/flowsnap/app/ui/components
          mkdir -p build-src/app/src/main/res/values
          mkdir -p build-src/app/src/main/res/drawable
          mkdir -p build-src/app/src/main/res/mipmap-anydpi-v26

      - name: Write Gradle build files
        working-directory: build-src
        run: |
          cat > settings.gradle.kts <<'FLOWSNAP_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FlowSnap"
          include(":app")
          FLOWSNAP_EOF

          cat > build.gradle.kts <<'FLOWSNAP_EOF'
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          FLOWSNAP_EOF

          cat > gradle.properties <<'FLOWSNAP_EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          FLOWSNAP_EOF

          cat > app/build.gradle.kts <<'FLOWSNAP_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.flowsnap.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.flowsnap.app"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
                  vectorDrawables { useSupportLibrary = true }
              }

              signingConfigs {
                  // Created only when the GitHub Actions workflow exported the keystore env vars.
                  val storeFilePath = System.getenv("FLOWSNAP_STORE_FILE")
                  if (!storeFilePath.isNullOrBlank() && file(storeFilePath).exists()) {
                      create("release") {
                          storeFile = file(storeFilePath)
                          storePassword = System.getenv("FLOWSNAP_STORE_PASSWORD")
                          keyAlias = System.getenv("FLOWSNAP_KEY_ALIAS")
                          keyPassword = System.getenv("FLOWSNAP_KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
                  release {
                      // Signed by the GitHub Actions workflow when secrets are present,
                      // otherwise falls back to the debug key so the APK still installs.
                      //
                      // R8 is OFF by default so the very first CI run is guaranteed green.
                      // Flip both flags to `true` (or build with -PminifyRelease=true) to
                      // shrink the APK from ~17 MB to ~5 MB once you are up and running.
                      val minify = (project.findProperty("minifyRelease") as String?)?.toBoolean() ?: false
                      isMinifyEnabled = minify
                      isShrinkResources = minify
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.findByName("release") ?: signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.navigation:navigation-compose:2.8.4")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("io.coil-kt:coil-video:2.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          FLOWSNAP_EOF

          cat > app/proguard-rules.pro <<'FLOWSNAP_EOF'
          -dontwarn okhttp3.**
          -dontwarn okio.**
          -keep class com.flowsnap.app.data.** { *; }
          -keepattributes Signature, InnerClasses, EnclosingMethod
          FLOWSNAP_EOF


      - name: Write AndroidManifest and resources
        working-directory: build-src
        run: |
          cat > app/src/main/AndroidManifest.xml <<'FLOWSNAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:name=".FlowSnapApp"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.FlowSnap">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@style/Theme.FlowSnap">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <!-- "Share to FlowSnap" from Instagram / any app -->
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>

                      <!-- Open instagram.com links with FlowSnap -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="www.instagram.com" />
                          <data android:scheme="https" android:host="instagram.com" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FLOWSNAP_EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'FLOWSNAP_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M54,26L54,66M54,66L40,52M54,66L68,52"
                  android:strokeWidth="7"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round">
                  <aapt:attr name="android:strokeColor">
                      <gradient
                          android:startX="34" android:startY="26"
                          android:endX="74" android:endY="70"
                          android:type="linear">
                          <item android:offset="0" android:color="#FF6A3DF5" />
                          <item android:offset="0.5" android:color="#FFD946EF" />
                          <item android:offset="1" android:color="#FFF43F5E" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:pathData="M36,74L72,74"
                  android:strokeWidth="7"
                  android:strokeLineCap="round"
                  android:strokeColor="#FFD946EF" />
          </vector>
          FLOWSNAP_EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'FLOWSNAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          FLOWSNAP_EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'FLOWSNAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          FLOWSNAP_EOF

          cat > app/src/main/res/values/colors.xml <<'FLOWSNAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#1A0B2E</color>
          </resources>
          FLOWSNAP_EOF

          cat > app/src/main/res/values/strings.xml <<'FLOWSNAP_EOF'
          <resources>
              <string name="app_name">FlowSnap</string>
          </resources>
          FLOWSNAP_EOF

          cat > app/src/main/res/values/themes.xml <<'FLOWSNAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FlowSnap" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0B0718</item>
                  <item name="android:navigationBarColor">#0B0718</item>
                  <item name="android:windowBackground">#0B0718</item>
              </style>
          </resources>
          FLOWSNAP_EOF


      - name: Write app source (data layer)
        working-directory: build-src
        run: |
          cat > app/src/main/java/com/flowsnap/app/data/DownloadStore.kt <<'FLOWSNAP_EOF'
          package com.flowsnap.app.data

          import android.content.Context
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          /** Tiny JSON-file backed store for the Downloads / Favorites screens. */
          class DownloadStore(context: Context) {

              private val file = File(context.filesDir, "downloads.json")
              private val _items = MutableStateFlow<List<DownloadRecord>>(emptyList())
              val items: StateFlow<List<DownloadRecord>> = _items

              init {
                  _items.value = load()
              }

              fun add(record: DownloadRecord) {
                  _items.value = listOf(record) + _items.value
                  persist()
              }

              fun remove(id: Long) {
                  _items.value = _items.value.filterNot { it.id == id }
                  persist()
              }

              fun toggleFavorite(id: Long) {
                  _items.value = _items.value.map {
                      if (it.id == id) it.copy(favorite = !it.favorite) else it
                  }
                  persist()
              }

              fun setCollection(id: Long, collection: String) {
                  _items.value = _items.value.map {
                      if (it.id == id) it.copy(collection = collection, favorite = true) else it
                  }
                  persist()
              }

              fun clearAll() {
                  _items.value = emptyList()
                  persist()
              }

              fun totalBytes(): Long = _items.value.sumOf { it.sizeBytes }

              private fun persist() {
                  runCatching {
                      val arr = JSONArray()
                      _items.value.forEach { r ->
                          arr.put(
                              JSONObject()
                                  .put("id", r.id)
                                  .put("fileName", r.fileName)
                                  .put("localUri", r.localUri)
                                  .put("remoteUrl", r.remoteUrl)
                                  .put("thumbnailUrl", r.thumbnailUrl)
                                  .put("kind", r.kind.name)
                                  .put("sizeBytes", r.sizeBytes)
                                  .put("createdAt", r.createdAt)
                                  .put("username", r.username)
                                  .put("favorite", r.favorite)
                                  .put("collection", r.collection)
                          )
                      }
                      file.writeText(arr.toString())
                  }
              }

              private fun load(): List<DownloadRecord> = runCatching {
                  if (!file.exists()) return emptyList()
                  val arr = JSONArray(file.readText())
                  (0 until arr.length()).mapNotNull { i ->
                      val o = arr.optJSONObject(i) ?: return@mapNotNull null
                      DownloadRecord(
                          id = o.optLong("id"),
                          fileName = o.optString("fileName"),
                          localUri = o.optString("localUri"),
                          remoteUrl = o.optString("remoteUrl"),
                          thumbnailUrl = o.optString("thumbnailUrl"),
                          kind = runCatching { MediaKind.valueOf(o.optString("kind")) }
                              .getOrDefault(MediaKind.PHOTO),
                          sizeBytes = o.optLong("sizeBytes"),
                          createdAt = o.optLong("createdAt"),
                          username = o.optString("username"),
                          favorite = o.optBoolean("favorite"),
                          collection = o.optString("collection")
                      )
                  }
              }.getOrDefault(emptyList())
          }
          FLOWSNAP_EOF

          cat > app/src/main/java/com/flowsnap/app/data/Downloader.kt <<'FLOWSNAP_EOF'
          package com.flowsnap.app.data

          import android.content.ContentValues
          import android.content.Context
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.withContext
          import okhttp3.Request
          import java.io.File
          import java.io.FileOutputStream
          import java.io.OutputStream

          data class Progress(val id: String, val fileName: String, val percent: Int, val done: Boolean = false)

          object Downloader {

              /** Live progress of the item currently downloading (null when idle). */
              val progress = MutableStateFlow<Progress?>(null)

              fun fileNameFor(post: ResolvedPost, item: MediaItem, index: Int): String {
                  val stamp = java.text.SimpleDateFormat("yyyyMMdd_HHmmss", java.util.Locale.US)
                      .format(java.util.Date())
                  val ext = if (item.kind == MediaKind.VIDEO) "mp4" else "jpg"
                  val prefix = if (item.kind == MediaKind.VIDEO) {
                      if (post.isReel) "reels" else "video"
                  } else "photo"
                  val suffix = if (post.items.size > 1) "_${index + 1}" else ""
                  return "${prefix}_${stamp}$suffix.$ext"
              }

              /**
               * Streams [variant] to the public gallery (Movies/FlowSnap or Pictures/FlowSnap)
               * and returns a [DownloadRecord] describing the saved file.
               */
              suspend fun download(
                  context: Context,
                  post: ResolvedPost,
                  item: MediaItem,
                  variant: MediaVariant,
                  fileName: String
              ): Result<DownloadRecord> = withContext(Dispatchers.IO) {
                  runCatching {
                      progress.value = Progress(item.id, fileName, 0)

                      val req = Request.Builder()
                          .url(variant.url)
                          .header("User-Agent", Net.UA)
                          .header("Referer", "https://www.instagram.com/")
                          .build()

                      Net.client.newCall(req).execute().use { resp ->
                          if (!resp.isSuccessful) error("Server returned HTTP ${resp.code}")
                          val body = resp.body ?: error("Empty response")
                          val total = body.contentLength()

                          val sink = openSink(context, fileName, item.kind)
                          var written = 0L
                          body.byteStream().use { input ->
                              sink.stream.use { output ->
                                  val buf = ByteArray(DEFAULT_BUFFER_SIZE)
                                  while (true) {
                                      val read = input.read(buf)
                                      if (read <= 0) break
                                      output.write(buf, 0, read)
                                      written += read
                                      if (total > 0) {
                                          progress.value = Progress(
                                              item.id, fileName, ((written * 100) / total).toInt()
                                          )
                                      }
                                  }
                                  output.flush()
                              }
                          }
                          sink.finish(context)
                          progress.value = Progress(item.id, fileName, 100, done = true)

                          DownloadRecord(
                              id = System.currentTimeMillis(),
                              fileName = fileName,
                              localUri = sink.uri.toString(),
                              remoteUrl = variant.url,
                              thumbnailUrl = item.thumbnailUrl,
                              kind = item.kind,
                              sizeBytes = written,
                              createdAt = System.currentTimeMillis(),
                              username = post.username
                          )
                      }
                  }.also { if (it.isFailure) progress.value = null }
              }

              private class Sink(val uri: Uri, val stream: OutputStream, val onFinish: (Context) -> Unit) {
                  fun finish(context: Context) = onFinish(context)
              }

              private fun openSink(context: Context, fileName: String, kind: MediaKind): Sink {
                  val isVideo = kind == MediaKind.VIDEO
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val collection = if (isVideo) {
                          MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                      } else {
                          MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                      }
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                          put(MediaStore.MediaColumns.MIME_TYPE, if (isVideo) "video/mp4" else "image/jpeg")
                          put(
                              MediaStore.MediaColumns.RELATIVE_PATH,
                              (if (isVideo) Environment.DIRECTORY_MOVIES else Environment.DIRECTORY_PICTURES) + "/FlowSnap"
                          )
                          put(MediaStore.MediaColumns.IS_PENDING, 1)
                      }
                      val resolver = context.contentResolver
                      val uri = resolver.insert(collection, values) ?: error("Cannot create file in gallery")
                      val out = resolver.openOutputStream(uri) ?: error("Cannot open output stream")
                      Sink(uri, out) { ctx ->
                          val done = ContentValues().apply { put(MediaStore.MediaColumns.IS_PENDING, 0) }
                          ctx.contentResolver.update(uri, done, null, null)
                      }
                  } else {
                      val dir = File(
                          Environment.getExternalStoragePublicDirectory(
                              if (isVideo) Environment.DIRECTORY_MOVIES else Environment.DIRECTORY_PICTURES
                          ),
                          "FlowSnap"
                      )
                      if (!dir.exists()) dir.mkdirs()
                      val file = File(dir, fileName)
                      Sink(Uri.fromFile(file), FileOutputStream(file)) { ctx ->
                          MediaScannerConnection.scanFile(ctx, arrayOf(file.absolutePath), null, null)
                      }
                  }
              }
          }
          FLOWSNAP_EOF

          cat > app/src/main/java/com/flowsnap/app/data/InstagramResolver.kt <<'FLOWSNAP_EOF'
          package com.flowsnap.app.data

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.FormBody
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject

          /**
           * Resolves a public Instagram post / reel / IGTV link into direct media URLs.
           *
           * Three strategies are tried in order, because Instagram rotates its public
           * surfaces fairly often:
           *   1. the `graphql/query` doc_id endpoint used by instagram.com itself
           *   2. the `/embed/captioned/` page (works for most single posts)
           *   3. plain OpenGraph meta tags on the post page (thumbnail / video fallback)
           */
          object InstagramResolver {

              /** doc_id for PolarisPostActionLoadPostQueryQuery. Update here if it ever rotates. */
              private const val DOC_ID = "8845758582119845"

              private val STORY_RE = Regex("""instagram\.com/stories/[^/]+/(\d+)""")

              private val SHORTCODE_RE =
                  Regex("""instagram\.com/(?:[A-Za-z0-9_.]+/)?(?:p|reel|reels|tv)/([A-Za-z0-9_-]+)""")

              fun extractShortcode(input: String): String? {
                  val url = input.trim()
                  SHORTCODE_RE.find(url)?.let { return it.groupValues[1] }
                  // bare shortcode pasted
                  if (url.matches(Regex("""^[A-Za-z0-9_-]{8,16}$"""))) return url
                  return null
              }

              fun findUrlInText(text: String): String? =
                  Regex("""https?://\S+""").find(text)?.value?.trimEnd('.', ',', ')')

              suspend fun resolve(rawInput: String): Result<ResolvedPost> = withContext(Dispatchers.IO) {
                  val input = findUrlInText(rawInput) ?: rawInput.trim()
                  if (input.contains("/stories/")) {
                      val storyId = STORY_RE.find(input)?.groupValues?.get(1)
                      return@withContext when {
                          Net.sessionId.isBlank() -> Result.failure(
                              IllegalArgumentException(
                                  "Stories and Highlights need a logged-in session. Add your Instagram " +
                                      "sessionid in Settings → Instagram session, then try again."
                              )
                          )
                          storyId == null -> Result.failure(
                              IllegalArgumentException("Open the story and copy its full link (it must end with the story id).")
                          )
                          else -> runCatching { viaPrivateApi(storyId, input) }
                      }
                  }
                  val code = extractShortcode(input)
                      ?: return@withContext Result.failure(
                          IllegalArgumentException("That doesn't look like an Instagram post or reel link.")
                      )

                  runCatching { viaGraphql(code, input) }
                      .recoverCatching { viaEmbed(code, input) }
                      .recoverCatching {
                          if (Net.sessionId.isNotBlank()) viaPrivateApi(mediaIdOf(code), input)
                          else throw it
                      }
                      .recoverCatching { viaOpenGraph(code, input) }
              }

              // ---------------------------------------------------------------- strategy 1

              private fun viaGraphql(code: String, source: String): ResolvedPost {
                  val body = FormBody.Builder()
                      .add("doc_id", DOC_ID)
                      .add("variables", JSONObject().put("shortcode", code).toString())
                      .build()

                  val req = Request.Builder()
                      .url("https://www.instagram.com/graphql/query")
                      .post(body)
                      .header("User-Agent", Net.UA)
                      .header("X-IG-App-ID", Net.IG_APP_ID)
                      .header("X-Requested-With", "XMLHttpRequest")
                      .header("Referer", "https://www.instagram.com/p/$code/")
                      .header("Content-Type", "application/x-www-form-urlencoded")
                      .apply {
                          val cookie = Net.cookieHeader()
                          if (cookie.isNotBlank()) header("Cookie", cookie)
                      }
                      .build()

                  Net.client.newCall(req).execute().use { resp ->
                      val text = resp.body?.string().orEmpty()
                      if (!resp.isSuccessful || text.isBlank()) error("graphql http ${resp.code}")
                      val media = JSONObject(text)
                          .optJSONObject("data")
                          ?.optJSONObject("xdt_shortcode_media")
                          ?: error("graphql: no media node")
                      return parseShortcodeMedia(media, code, source)
                  }
              }

              private fun parseShortcodeMedia(node: JSONObject, code: String, source: String): ResolvedPost {
                  val owner = node.optJSONObject("owner")
                  val username = owner?.optString("username").orEmpty().ifBlank { "instagram" }
                  val avatar = owner?.optString("profile_pic_url").orEmpty()
                  val caption = node.optJSONObject("edge_media_to_caption")
                      ?.optJSONArray("edges")?.optJSONObject(0)
                      ?.optJSONObject("node")?.optString("text").orEmpty()

                  val items = mutableListOf<MediaItem>()
                  val sidecar = node.optJSONObject("edge_sidecar_to_children")?.optJSONArray("edges")
                  if (sidecar != null && sidecar.length() > 0) {
                      for (i in 0 until sidecar.length()) {
                          sidecar.optJSONObject(i)?.optJSONObject("node")?.let { child ->
                              items += singleNodeToItem(child, "$code-${i + 1}")
                          }
                      }
                  } else {
                      items += singleNodeToItem(node, code)
                  }

                  val typename = node.optString("__typename")
                  return ResolvedPost(
                      shortcode = code,
                      username = username,
                      avatarUrl = avatar,
                      caption = caption,
                      isReel = typename.contains("Video") || node.optBoolean("is_video"),
                      items = items,
                      sourceUrl = source
                  )
              }

              private fun singleNodeToItem(node: JSONObject, id: String): MediaItem {
                  val isVideo = node.optBoolean("is_video")
                  val thumb = node.optString("display_url").ifBlank {
                      node.optJSONArray("display_resources")?.lastObject()?.optString("src").orEmpty()
                  }
                  val dims = node.optJSONObject("dimensions")
                  val w = dims?.optInt("width") ?: 0
                  val h = dims?.optInt("height") ?: 0

                  val variants = mutableListOf<MediaVariant>()
                  if (isVideo) {
                      val main = node.optString("video_url")
                      if (main.isNotBlank()) {
                          variants += MediaVariant("Original (Best Quality)", main, w, h)
                      }
                      node.optJSONArray("video_resources")?.let { arr ->
                          for (i in 0 until arr.length()) {
                              val v = arr.optJSONObject(i) ?: continue
                              val src = v.optString("src")
                              val vh = v.optInt("height")
                              if (src.isNotBlank() && variants.none { it.url == src }) {
                                  variants += MediaVariant(labelFor(vh), src, v.optInt("width"), vh)
                              }
                          }
                      }
                  } else {
                      node.optJSONArray("display_resources")?.let { arr ->
                          for (i in arr.length() - 1 downTo 0) {
                              val v = arr.optJSONObject(i) ?: continue
                              val src = v.optString("src")
                              val vh = v.optInt("config_height")
                              if (src.isNotBlank()) {
                                  val label = if (variants.isEmpty()) "Original (Best Quality)" else labelFor(vh)
                                  variants += MediaVariant(label, src, v.optInt("config_width"), vh)
                              }
                          }
                      }
                      if (variants.isEmpty() && thumb.isNotBlank()) {
                          variants += MediaVariant("Original (Best Quality)", thumb, w, h)
                      }
                  }

                  return MediaItem(
                      id = id,
                      kind = if (isVideo) MediaKind.VIDEO else MediaKind.PHOTO,
                      thumbnailUrl = thumb,
                      variants = variants.distinctBy { it.url },
                      durationSec = node.optDouble("video_duration", 0.0)
                  )
              }

              private fun labelFor(height: Int): String = when {
                  height >= 1920 -> "1080p (HD)"
                  height >= 1080 -> "1080p (HD)"
                  height >= 720 -> "720p (Good)"
                  height >= 480 -> "480p (Small)"
                  height > 0 -> "${height}p"
                  else -> "Alternate"
              }

              // ---------------------------------------------------------------- strategy 2

              private fun viaEmbed(code: String, source: String): ResolvedPost {
                  val html = getText("https://www.instagram.com/p/$code/embed/captioned/")

                  // The embed page inlines a JSON blob with the real media node.
                  val ctx = Regex("""\\"gql_data\\":(\{.*?\})\s*,\\"fbid""", RegexOption.DOT_MATCHES_ALL)
                      .find(html)?.groupValues?.get(1)
                  if (ctx != null) {
                      runCatching {
                          val json = JSONObject(unescape(ctx))
                          val node = json.optJSONObject("shortcode_media")
                          if (node != null) return parseShortcodeMedia(node, code, source)
                      }
                  }

                  val videoUrl = Regex(""""video_url":"(.*?)"""").find(html)?.groupValues?.get(1)
                      ?.let { unescape(it) }
                  val imageUrl = Regex("""class="EmbeddedMediaImage"[^>]*src="(.*?)"""")
                      .find(html)?.groupValues?.get(1)?.let { htmlUnescape(it) }
                      ?: Regex(""""display_url":"(.*?)"""").find(html)?.groupValues?.get(1)?.let { unescape(it) }
                  val user = Regex("""class="UsernameText">(.*?)<""").find(html)?.groupValues?.get(1).orEmpty()

                  val thumb = imageUrl.orEmpty()
                  val item = when {
                      videoUrl != null -> MediaItem(
                          code, MediaKind.VIDEO, thumb,
                          listOf(MediaVariant("Original (Best Quality)", videoUrl))
                      )
                      thumb.isNotBlank() -> MediaItem(
                          code, MediaKind.PHOTO, thumb,
                          listOf(MediaVariant("Original (Best Quality)", thumb))
                      )
                      else -> error("embed: nothing found")
                  }
                  return ResolvedPost(code, user.ifBlank { "instagram" }, "", "", videoUrl != null, listOf(item), source)
              }

              // ---------------------------------------------------------------- strategy 3

              private fun viaOpenGraph(code: String, source: String): ResolvedPost {
                  val html = getText("https://www.instagram.com/p/$code/")
                  fun meta(prop: String) =
                      Regex("""<meta[^>]+property=["']$prop["'][^>]+content=["'](.*?)["']""")
                          .find(html)?.groupValues?.get(1)?.let { htmlUnescape(it) }
                          ?: Regex("""<meta[^>]+content=["'](.*?)["'][^>]+property=["']$prop["']""")
                              .find(html)?.groupValues?.get(1)?.let { htmlUnescape(it) }

                  val video = meta("og:video") ?: meta("og:video:secure_url")
                  val image = meta("og:image")
                  val title = meta("og:title").orEmpty()
                  val user = Regex("""@([A-Za-z0-9_.]+)""").find(title)?.groupValues?.get(1) ?: "instagram"

                  val item = when {
                      !video.isNullOrBlank() -> MediaItem(
                          code, MediaKind.VIDEO, image.orEmpty(),
                          listOf(MediaVariant("Original (Best Quality)", video))
                      )
                      !image.isNullOrBlank() -> MediaItem(
                          code, MediaKind.PHOTO, image,
                          listOf(MediaVariant("Original (Best Quality)", image))
                      )
                      else -> error(
                          "Could not read this post. It may be private, age-restricted, or Instagram " +
                              "changed its API."
                      )
                  }
                  return ResolvedPost(code, user, "", title, !video.isNullOrBlank(), listOf(item), source)
              }

              // ------------------------------------------------- strategy 4 (needs cookie)

              /**
               * `i.instagram.com/api/v1/media/<id>/info/` — the app API. Requires a sessionid
               * cookie but returns Stories, Highlights and private-but-followed media too.
               */
              private fun viaPrivateApi(mediaId: String, source: String): ResolvedPost {
                  val json = JSONObject(
                      getText("https://i.instagram.com/api/v1/media/$mediaId/info/", appApi = true)
                  )
                  val node = json.optJSONArray("items")?.optJSONObject(0)
                      ?: error("Media not available for this account.")
                  val user = node.optJSONObject("user")?.optString("username").orEmpty().ifBlank { "instagram" }
                  val avatar = node.optJSONObject("user")?.optString("profile_pic_url").orEmpty()
                  val caption = node.optJSONObject("caption")?.optString("text").orEmpty()

                  val children = node.optJSONArray("carousel_media")
                  val items = if (children != null && children.length() > 0) {
                      (0 until children.length()).mapNotNull { i ->
                          children.optJSONObject(i)?.let { apiNodeToItem(it, "$mediaId-${i + 1}") }
                      }
                  } else {
                      listOf(apiNodeToItem(node, mediaId))
                  }

                  return ResolvedPost(
                      shortcode = node.optString("code", mediaId),
                      username = user,
                      avatarUrl = avatar,
                      caption = caption,
                      isReel = items.any { it.kind == MediaKind.VIDEO },
                      items = items,
                      sourceUrl = source
                  )
              }

              private fun apiNodeToItem(node: JSONObject, id: String): MediaItem {
                  val isVideo = node.optInt("media_type") == 2 || node.has("video_versions")
                  val thumb = node.optJSONObject("image_versions2")
                      ?.optJSONArray("candidates")?.optJSONObject(0)?.optString("url").orEmpty()

                  val variants = mutableListOf<MediaVariant>()
                  if (isVideo) {
                      node.optJSONArray("video_versions")?.let { arr ->
                          for (i in 0 until arr.length()) {
                              val v = arr.optJSONObject(i) ?: continue
                              val h = v.optInt("height")
                              variants += MediaVariant(
                                  if (i == 0) "Original (Best Quality)" else labelFor(h),
                                  v.optString("url"), v.optInt("width"), h
                              )
                          }
                      }
                  } else {
                      node.optJSONObject("image_versions2")?.optJSONArray("candidates")?.let { arr ->
                          for (i in 0 until arr.length()) {
                              val v = arr.optJSONObject(i) ?: continue
                              val h = v.optInt("height")
                              variants += MediaVariant(
                                  if (i == 0) "Original (Best Quality)" else labelFor(h),
                                  v.optString("url"), v.optInt("width"), h
                              )
                          }
                      }
                  }
                  if (variants.isEmpty() && thumb.isNotBlank()) {
                      variants += MediaVariant("Original (Best Quality)", thumb)
                  }

                  return MediaItem(
                      id = id,
                      kind = if (isVideo) MediaKind.VIDEO else MediaKind.PHOTO,
                      thumbnailUrl = thumb,
                      variants = variants.distinctBy { it.url },
                      durationSec = node.optDouble("video_duration", 0.0)
                  )
              }

              /** Instagram shortcodes are just base64url-encoded media ids. */
              fun mediaIdOf(shortcode: String): String {
                  val alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
                  var id = java.math.BigInteger.ZERO
                  val sixtyFour = java.math.BigInteger.valueOf(64)
                  shortcode.takeWhile { alphabet.indexOf(it) >= 0 }.forEach { c ->
                      id = id.multiply(sixtyFour).add(java.math.BigInteger.valueOf(alphabet.indexOf(c).toLong()))
                  }
                  return id.toString()
              }

              // ---------------------------------------------------------------- helpers

              private fun getText(url: String, appApi: Boolean = false): String {
                  val req = Request.Builder()
                      .url(url)
                      .header("User-Agent", if (appApi) Net.APP_UA else Net.UA)
                      .header("Accept-Language", "en-US,en;q=0.9")
                      .header("X-IG-App-ID", Net.IG_APP_ID)
                      .apply {
                          val cookie = Net.cookieHeader()
                          if (cookie.isNotBlank()) header("Cookie", cookie)
                      }
                      .build()
                  Net.client.newCall(req).execute().use { resp ->
                      val text = resp.body?.string().orEmpty()
                      if (!resp.isSuccessful) error("http ${resp.code}")
                      return text
                  }
              }

              /** Resolve the real file size with a HEAD request (nice for the quality picker). */
              suspend fun contentLength(url: String): Long = withContext(Dispatchers.IO) {
                  runCatching {
                      val req = Request.Builder().url(url).head()
                          .header("User-Agent", Net.UA).build()
                      Net.client.newCall(req).execute().use { it.header("Content-Length")?.toLong() ?: 0L }
                  }.getOrDefault(0L)
              }

              private fun unescape(s: String): String =
                  s.replace("\\\\u0025", "%")
                      .replace("\\u0025", "%")
                      .replace("\\\\/", "/")
                      .replace("\\/", "/")
                      .replace("\\\\\"", "\"")
                      .replace("\\\"", "\"")
                      .replace("\\\\u0026", "&")
                      .replace("\\u0026", "&")

              private fun htmlUnescape(s: String): String =
                  s.replace("&amp;", "&").replace("&quot;", "\"").replace("&#039;", "'")
                      .replace("&lt;", "<").replace("&gt;", ">")

              private fun JSONArray.lastObject(): JSONObject? =
                  if (length() == 0) null else optJSONObject(length() - 1)
          }
          FLOWSNAP_EOF

