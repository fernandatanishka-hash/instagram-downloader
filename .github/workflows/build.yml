              val store = DownloadStore(app)
              val prefs = Prefs(app)
              val downloadProgress = Downloader.progress

              private val _link = MutableStateFlow("")
              val link: StateFlow<String> = _link

              private val _state = MutableStateFlow<ResolveState>(ResolveState.Idle)
              val state: StateFlow<ResolveState> = _state

              private val _toast = MutableStateFlow<String?>(null)
              val toast: StateFlow<String?> = _toast

              /** Index of the carousel item currently shown on the preview screen. */
              private val _selectedIndex = MutableStateFlow(0)
              val selectedIndex: StateFlow<Int> = _selectedIndex

              fun setLink(value: String) {
                  _link.value = value
              }

              fun selectIndex(i: Int) {
                  _selectedIndex.value = i
              }

              fun consumeToast() {
                  _toast.value = null
              }

              fun showToast(msg: String) {
                  _toast.value = msg
              }

              fun handleIntent(intent: Intent?) {
                  val text = when (intent?.action) {
                      Intent.ACTION_SEND -> intent.getStringExtra(Intent.EXTRA_TEXT)
                      Intent.ACTION_VIEW -> intent.dataString
                      else -> null
                  } ?: return
                  val url = InstagramResolver.findUrlInText(text) ?: text
                  _link.value = url
                  resolve(url)
              }

              fun resolve(input: String = _link.value) {
                  val value = input.trim()
                  if (value.isEmpty()) {
                      _toast.value = "Paste an Instagram link first"
                      return
                  }
                  _selectedIndex.value = 0
                  _state.value = ResolveState.Loading
                  viewModelScope.launch {
                      val result = InstagramResolver.resolve(value)
                      _state.value = result.fold(
                          onSuccess = { post ->
                              if (post.items.isEmpty()) ResolveState.Error("No media found in that post.")
                              else ResolveState.Success(withSizes(post))
                          },
                          onFailure = { ResolveState.Error(it.message ?: "Could not resolve this link.") }
                      )
                  }
              }

              private suspend fun withSizes(post: ResolvedPost): ResolvedPost {
                  val items = post.items.map { item ->
                      item.copy(
                          variants = item.variants.map { v ->
                              if (v.approxBytes > 0) v
                              else v.copy(approxBytes = InstagramResolver.contentLength(v.url))
                          }
                      )
                  }
                  return post.copy(items = items)
              }

              fun reset() {
                  _state.value = ResolveState.Idle
                  _link.value = ""
              }

              fun download(post: ResolvedPost, item: MediaItem, variant: MediaVariant, index: Int) {
                  viewModelScope.launch {
                      val name = Downloader.fileNameFor(post, item, index)
                      val res = Downloader.download(getApplication(), post, item, variant, name)
                      res.fold(
                          onSuccess = {
                              store.add(it)
                              _toast.value = "Saved ${it.fileName}"
                          },
                          onFailure = { _toast.value = "Download failed: ${it.message}" }
                      )
                  }
              }

              fun downloadAll(post: ResolvedPost) {
                  viewModelScope.launch {
                      post.items.forEachIndexed { i, item ->
                          val v = item.best ?: return@forEachIndexed
                          val name = Downloader.fileNameFor(post, item, i)
                          Downloader.download(getApplication(), post, item, v, name)
                              .onSuccess { store.add(it) }
                      }
                      _toast.value = "Saved ${post.items.size} files"
                  }
              }
          }
